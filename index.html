<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis ganancias</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ebed;--surface:#fffafb;--ink:#4a1f2c;--mute:#8c6573;--in:#0b8f80;--out:#c4246e;--line:#e8d3d9;--accent:#f59e0b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#180710;--surface:#240d16;--ink:#f2dde3;--mute:#b08593;--in:#5eead4;--out:#f4719f;--line:#3a1825;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#180710;--surface:#240d16;--ink:#f2dde3;--mute:#b08593;--in:#5eead4;--out:#f4719f;--line:#3a1825;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.1rem;font-weight:600;margin:0;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lft{display:flex;align-items:center;gap:10px}
#menu{position:fixed;top:0;left:0;width:min(80vw,320px);max-height:100%;margin:0;border-radius:0 0 20px 0;overflow-y:auto;z-index:40;padding:calc(var(--mt,0px) + 4px) 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);transition:transform .22s ease;box-shadow:8px 8px 32px rgba(0,0,0,.3)}
#menu.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);z-index:39;opacity:0;transition:opacity .22s ease}
.top{position:relative;z-index:42}
#theme{font-size:1.15rem;line-height:1;padding:8px 12px}
.scrim.open{opacity:1}
#menuBtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}.card .mt{font-size:1rem}
#menu .seg span{font-size:.92rem}
.hint{color:var(--mute);font-size:.82rem;margin:8px 0 0}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
#authErr:empty{display:none}
.wel{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wel span{flex-basis:100%;color:var(--mute);font-size:.85rem}
.wel b{flex:1;font-size:1.25rem}
.bkb{margin-bottom:14px;border-left:4px solid var(--accent)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;z-index:60;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -8px 32px rgba(0,0,0,.3)}
.sheet.open{transform:none}
#edScrim{z-index:55}
#edForm{background:none;border:0;padding:0;margin:0}
#edMsg:empty{display:none}
.tbl tr.mv{cursor:pointer}.tbl tr.mv:active td{opacity:.8}
.hint.ver{color:#a86f00;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hint.ver{color:#f5b82e}}
:root[data-theme="dark"] .hint.ver{color:#f5b82e}
.pw{position:relative}
.pw input[type=password],.pw input[type=text]{padding-right:44px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mute);cursor:pointer;padding:6px;display:grid;place-items:center}
.eye svg{width:20px;height:20px}
.tg{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink)}
.cur{color:var(--mute);margin:0 0 10px;font-weight:600}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card span{display:block;color:var(--mute);font-size:.82rem}
.card b{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card.big{border-top:4px solid var(--accent)}
.card.psv{position:relative;background:#f5b82e;border-color:#f5b82e;color:#12223b}
.card.psv span{color:rgba(18,34,59,.75)}
.card.psv b{font-size:clamp(1.3rem,6.2vw,1.7rem)}
.card.psv small{display:block;font-size:.78rem;color:rgba(18,34,59,.75);margin-top:4px}
.card.pin{background:#4fd1c0;border-color:#4fd1c0;color:#12223b}
.card.pout{background:#ec5c8f;border-color:#ec5c8f;color:#12223b}
.card.pin span,.card.pout span{color:rgba(18,34,59,.75)}
.card.pin,.card.pout{position:relative}
.ico{position:absolute;top:8px;right:8px;width:42px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.card.pin b,.card.pout b{font-size:1.7rem}
.card.big b{font-size:clamp(1.4rem,7vw,2.1rem)}
.card.big small{display:block;color:var(--mute);font-size:.82rem;margin-top:4px}
.card.big.neg b{color:var(--out)}
.leg{display:flex;gap:14px;margin:0;font-size:.8rem;font-weight:600}
.leghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tg.sm{padding:4px 10px;font-size:.8rem;line-height:1.2}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:0;margin-bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92vw,420px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20}
.toast button{border:0;background:none;color:var(--accent);font:inherit;font-weight:800;cursor:pointer;padding:4px 6px}
#toastMsg{flex:1}
.ring{position:relative;width:28px;height:28px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring-bg{stroke:rgba(128,128,128,.45)}
.ring-fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:0}
.ring b{font-size:.78rem}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f3 label{font-size:.78rem;color:var(--mute);display:grid;gap:2px}
.f3 label input{padding:5px 10px}
.card.pcard{padding:8px 12px 10px}
#psum:empty{display:none}
#psum{margin-top:6px}
.bgrid{display:grid;gap:10px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.bh b{font-size:1rem}.bh span{font-size:.78rem}
.bn{display:flex;gap:18px;flex-wrap:wrap}
.bn b{font-size:1.1rem}
.pb{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.pb i{display:block;height:100%;background:var(--in)}.pb i.o{background:var(--out)}.pb i.b{background:#6cc0f5}.blu{color:#2a93d8}.pb i.l{background:#b79cf0}.pb i.y{background:#f5b82e}
.cn{font-size:.8rem;color:var(--mute);margin-top:8px}.cn.warn{color:var(--out)}.cn.hard{color:var(--out);font-weight:700}.lil{color:#9a6fe0}.yel{color:#d19a00}.pc{font-style:normal}.f3 input{font-weight:800}.f3 input.blu{color:#2a93d8}.f3 input.lil{color:#9a6fe0}.f3 input.yel{color:#d19a00}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem}.chk input{width:auto}
.in{color:var(--in)}.out{color:var(--out)}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;margin:12px 0 4px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.pair{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%;justify-content:center}
.bar{width:42%;min-height:2px;border-radius:3px 3px 0 0}
.bar.i{background:var(--in)}.bar.o{background:var(--out)}
.col.now .pair{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.lbls{display:flex;gap:6px;font-size:.68rem;color:var(--mute);text-align:center}
.lbls div{flex:1;overflow:hidden;white-space:nowrap;text-overflow:clip}
h2{font-size:1rem;margin:26px 0 8px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
.tbl th{font-size:.78rem;font-weight:600;color:var(--mute);text-align:right;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td:first-child{font-weight:600}
.tbl td.in{background:color-mix(in srgb,var(--in) 9%,transparent)}
.tbl td.out{background:color-mix(in srgb,var(--out) 9%,transparent)}
.tbl th.in{color:var(--in)}.tbl th.out{color:var(--out)}
.tbl td.mut{color:var(--mute);font-size:.85rem}
.tbl td.sv{color:#d19a00;background:color-mix(in srgb,#f5b82e 12%,transparent)}.tbl th.sv{color:#d19a00}
#periods .tbl th,#periods .tbl td{padding-left:8px;padding-right:8px}#periods .tbl td{font-size:.9rem}
.tbl small.bs{display:block;color:var(--mute);font-size:.72rem;font-weight:400;margin-top:2px;white-space:nowrap}
.del{border:0;background:none;color:var(--mute);font-size:1.2rem;cursor:pointer;padding:4px 8px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-top:0}
.seg{display:flex;gap:6px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:9px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer}
.seg input:checked+span.a{border-color:var(--in);color:var(--in)}
.seg input:checked+span.b{border-color:var(--out);color:var(--out)}
.seg input:focus-visible+span,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.f{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=number],input[type=date],input[type=text],input[type=password],select{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.save{border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;padding:12px;border-radius:10px;cursor:pointer}
.msg{color:var(--out);font-size:.85rem;min-height:1.1em;margin:0}
.rate{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mute);font-size:.88rem;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rate input{max-width:120px}
.empty{color:var(--mute);padding:14px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="auth" hidden>
<h1 style="font-size:1.7rem;color:var(--ink);margin:40px 0 4px">Mis ganancias</h1>
<p class="hint" style="margin:0 0 18px">Entra o crea tu cuenta para llevar tus finanzas.</p>
<div class="seg" style="margin-bottom:12px"><label><input type="radio" name="am" value="login"><span class="a">Entrar</span></label><label><input type="radio" name="am" value="reg"><span class="a">Crear cuenta</span></label></div>
<form id="authForm" autocomplete="on">
<div id="welcome" class="wel" hidden><span>Hola de nuevo</span><b id="wname"></b><button type="button" id="other" class="tg sm">Usar otra cuenta</button></div>
<input type="text" id="au" placeholder="Nombre de usuario" autocomplete="username" aria-label="Nombre de usuario">
<div class="pw"><input type="password" id="ap" placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña"><button type="button" class="eye" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M3 3l18 18" style="display:none"/></svg></button></div>
<div class="pw" hidden><input type="password" id="ap2" placeholder="Repite la contraseña" autocomplete="new-password" aria-label="Repetir contraseña"><button type="button" class="eye" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M3 3l18 18" style="display:none"/></svg></button></div>
<p class="msg" id="authErr" role="alert"></p>
<button class="save" type="submit" id="authBtn">Entrar</button>
</form>
<button type="button" id="bkLoad" class="tg" style="width:100%;margin-top:10px">Cargar respaldo</button>
<input type="file" id="bkFile" accept=".json,application/json" hidden>
<p class="msg" id="bkMsg" style="margin-top:8px"></p>
<p class="hint" id="authNote"></p>
<p class="hint ver" id="verAuth" style="text-align:center;margin-top:18px"></p>
</main>
<main id="app" hidden>
<div class="top"><div class="lft"><button id="menuBtn" class="tg" type="button" aria-label="Menú" aria-expanded="false" aria-controls="menu">☰</button><h1>Mis ganancias</h1></div><button id="theme" class="tg" type="button" aria-label="Cambiar entre modo claro y oscuro"></button></div>
<div class="scrim" id="scrim" hidden></div>
<div class="card" id="menu" hidden role="dialog" aria-label="Menú">
<b class="mt">Frecuencia de cobro</b>
<div class="seg" style="margin-top:10px"><label><input type="radio" name="freq" value="week"><span class="a">Semanal</span></label><label><input type="radio" name="freq" value="bi"><span class="a">Quincenal</span></label></div>
<p class="hint" id="freqHint"></p>
<b class="mt" style="display:block;margin-top:16px">Ver por</b>
<div class="seg" style="margin-top:10px"><label><input type="radio" name="per" value="week" checked><span class="a" id="tabWeek">Semanas</span></label><label><input type="radio" name="per" value="month"><span class="a">Meses</span></label><label><input type="radio" name="per" value="year"><span class="a">Años</span></label></div>
<b class="mt" style="display:block;margin-top:16px">Respaldo</b>
<p class="hint" id="bkInfo"></p>
<button type="button" id="bkSave" class="save" style="width:100%;margin-top:10px">Guardar respaldo</button>
<div class="acct"><span id="who"></span><button type="button" id="logout" class="tg sm">Cerrar sesión</button></div>
<p class="hint ver" id="verMenu"></p>
</div>


<div class="card bkb" id="bkBanner" hidden>
<p id="bkTxt" style="margin:0 0 10px"></p>
<div class="f2"><button type="button" id="bkNow" class="save">Guardar ahora</button><button type="button" id="bkLater" class="tg">Más tarde</button></div>
</div>
<p class="cur" id="curLabel"></p>
<section class="cards">
<div class="card pin"><svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="gG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#f6b92b"/><stop offset="1" stop-color="#c47d00"/></radialGradient><linearGradient id="gC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fcd34d"/><stop offset=".5" stop-color="#fff1a6"/><stop offset="1" stop-color="#e09b0a"/></linearGradient></defs><ellipse cx="32" cy="59" rx="27" ry="3.5" fill="#000" opacity=".18"/><path d="M18 24C4 34 4 50 14 55C22 59 36 59 42 55C52 50 52 34 38 24Z" fill="url(#gG)"/><path d="M18 24Q28 28 38 24L36 13Q28 18 20 13Z" fill="url(#gG)"/><ellipse cx="28" cy="25" rx="11" ry="3.6" fill="#1e9e86"/><ellipse cx="26" cy="24" rx="7" ry="1.4" fill="#7ee2cc" opacity=".7"/><ellipse cx="17" cy="39" rx="3.5" ry="8" fill="#fff" opacity=".4" transform="rotate(18 17 39)"/><text x="27" y="49" text-anchor="middle" font-size="20" font-weight="800" fill="#17835f">$</text><g><ellipse cx="51" cy="53" rx="8" ry="3.2" fill="#b86e00"/><rect x="43" y="50" width="16" height="3" fill="#e69b0b"/><ellipse cx="51" cy="50" rx="8" ry="3.2" fill="url(#gC)"/><ellipse cx="51" cy="49" rx="8" ry="3.2" fill="#b86e00"/><rect x="43" y="46" width="16" height="3" fill="#e69b0b"/><ellipse cx="51" cy="46" rx="8" ry="3.2" fill="url(#gC)"/><ellipse cx="51" cy="45" rx="8" ry="3.2" fill="#b86e00"/><rect x="43" y="42" width="16" height="3" fill="#e69b0b"/><ellipse cx="51" cy="42" rx="8" ry="3.2" fill="url(#gC)"/></g></svg><span>Ganancias</span><b id="tin">$0</b></div>
<div class="card pout"><svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="60" rx="22" ry="3" fill="#000" opacity=".18"/><circle cx="26" cy="39" r="18" fill="#b86e00"/><circle cx="26" cy="35" r="18" fill="url(#gG)"/><circle cx="26" cy="35" r="13" fill="none" stroke="#c47d00" stroke-width="2" opacity=".6"/><ellipse cx="17" cy="27" rx="4" ry="7" fill="#fff" opacity=".4" transform="rotate(30 17 27)"/><text x="26" y="43" text-anchor="middle" font-size="22" font-weight="800" fill="#a85f00">$</text><circle cx="52" cy="13" r="8" fill="#b86e00"/><circle cx="52" cy="11" r="8" fill="url(#gG)"/><circle cx="52" cy="11" r="5" fill="none" stroke="#c47d00" stroke-width="1.5" opacity=".6"/><path d="M52 22V30M48.5 27L52 30.5L55.5 27" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg><span>Gastos</span><b id="tout">$0</b></div>
<div class="card big" id="bigcard"><span>Saldo disponible</span><b id="net">$0</b><small id="netSub"></small></div>
<div class="card psv"><svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="gP" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffd6e2"/><stop offset=".55" stop-color="#f28ca8"/><stop offset="1" stop-color="#c95a7c"/></radialGradient></defs><ellipse cx="32" cy="60" rx="24" ry="3" fill="#000" opacity=".18"/><path d="M9 36Q2 34 4 26" fill="none" stroke="#d9708f" stroke-width="2.4" stroke-linecap="round"/><path d="M16 48h7v10h-7zM37 50h7v8h-7z" fill="#d9708f"/><ellipse cx="30" cy="37" rx="22" ry="17" fill="url(#gP)"/><path d="M16 25L19 12L29 21Z" fill="#e07d9a"/><ellipse cx="53" cy="39" rx="6" ry="5" fill="#f4a1b8"/><circle cx="51.5" cy="39" r="1" fill="#8a3552"/><circle cx="54.5" cy="39" r="1" fill="#8a3552"/><circle cx="43" cy="31" r="1.9" fill="#3b1d2a"/><ellipse cx="20" cy="32" rx="3.5" ry="6" fill="#fff" opacity=".35" transform="rotate(20 20 32)"/><rect x="24" y="20" width="13" height="2.6" rx="1.3" fill="#8a3552"/><ellipse cx="30.5" cy="11" rx="6.5" ry="6.5" fill="url(#gG)"/><ellipse cx="30.5" cy="11" rx="3.6" ry="3.6" fill="none" stroke="#c47d00" stroke-width="1.4" opacity=".6"/></svg><span>Ahorros</span><b id="tsav">$0</b><small id="svSub"></small></div>
</section>

<div class="leghead" style="margin:26px 0 8px"><h2 style="margin:0" id="repTitle">Reparto semanal</h2><button type="button" id="budTg" class="tg sm" aria-label="Minimizar reparto semanal" aria-expanded="true" aria-controls="budBody">▲</button></div>
<div id="budBody">
<p class="cur" id="bwk"></p>
<div class="bgrid" id="budget"></div>
<div class="card pcard" style="margin-top:10px"><div class="f3"><label>Necesidades %<input type="text" id="pn" class="blu" inputmode="numeric"></label><label>Gustos %<input type="text" id="pg" class="lil" inputmode="numeric"></label><label>Ahorro %<input type="text" id="pa" class="yel" inputmode="numeric"></label></div><p class="msg" id="psum"></p></div>
</div>



<div class="leghead" style="margin-top:26px"><h2 style="margin:0">Historial de movimientos</h2><button type="button" id="recTg" class="tg sm" aria-label="Minimizar historial" aria-expanded="true" aria-controls="recent">▲</button></div>
<div id="recent" style="margin-top:8px"></div>

</div>

$('authForm').onsubmit=function(ev){ev.preventDefault();var name=$('au').value.trim(),pw=$('ap').value,m=$('authErr'),key=name.toLowerCase(),U=users();m.textContent='';

 else{var days=Math.floor((now-new Date(S.lastBackup).getTime())/86400000);if(days>=7)msg='Hace '+days+' días que no guardas un respaldo. ¿Quieres guardar uno ahora?';else if(n>=15)msg='Has registrado '+n+' movimientos nuevos desde tu último respaldo. ¿Quieres guardar uno ahora?';}

 try{localStorage.setItem('misGanancias.u.'+key,JSON.stringify(D));}catch(e){m.textContent='No se pudo guardar en este dispositivo.';return;}

 rd.readAsText(f);};
